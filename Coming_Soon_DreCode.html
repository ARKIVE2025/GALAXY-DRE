<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRE — Sign In</title>
<style>
  :root{
    --bg:#ffffff;
    --panel:#f5f5f7;
    --line:#e2e2e5;
    --ink:#1d1d1f;
    --ink-dim:#6e6e73;
    --ink-faint:#86868b;
    --accent:#0071e3;
    --error:#e0393e;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}

  /* ── Ambient gradient mesh backdrop ── */
  .mesh{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .mesh span{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.55;
  }
  .mesh .b1{
    width:520px;height:520px;top:-180px;left:-140px;
    background:radial-gradient(circle at 30% 30%, #7dd2ff, transparent 70%);
  }
  .mesh .b2{
    width:480px;height:480px;top:-120px;right:-160px;
    background:radial-gradient(circle at 60% 40%, #c9a6ff, transparent 70%);
  }
  .mesh .b3{
    width:560px;height:560px;bottom:-220px;left:50%;transform:translateX(-50%);
    background:radial-gradient(circle at 50% 50%, #ffd6a6, transparent 70%);
    opacity:.35;
  }

  header{padding:24px 32px;position:relative;z-index:1;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;}
  .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    position:relative;
    z-index:1;
  }

  .card{
    width:100%;
    max-width:400px;
    text-align:center;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    border:1px solid rgba(255,255,255,.6);
    border-radius:28px;
    padding:44px 36px 36px;
    box-shadow:
      0 1px 1px rgba(0,0,0,.02),
      0 8px 24px rgba(0,0,0,.06),
      0 24px 60px rgba(0,0,0,.08);
  }

  .app-icon{
    width:64px;height:64px;
    margin:0 auto 22px;
    border-radius:18px;
    background:linear-gradient(155deg,#3fa8ff 0%,#0071e3 55%,#5a5cf0 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:
      0 1px 0 rgba(255,255,255,.4) inset,
      0 10px 24px rgba(0,113,227,.35);
  }
  .app-icon span{
    width:22px;height:22px;border-radius:50%;
    background:#fff;
    box-shadow:0 0 0 4px rgba(255,255,255,.18);
  }

  .card h1{
    font-size:1.6rem;
    font-weight:600;
    letter-spacing:-.01em;
    margin-bottom:8px;
  }
  .card p.sub{
    color:var(--ink-dim);
    font-size:.95rem;
    margin-bottom:32px;
  }

  form{text-align:left;}

  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size:.8rem;
    font-weight:600;
    color:var(--ink-dim);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:.95rem;
    font-family:var(--sans);
    color:var(--ink);
    background:#fff;
    outline:none;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(0,113,227,.12);
    background:#fff;
  }
  .field input.error{
    border-color:var(--error);
    animation:shake .3s ease;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-4px);}
    75%{transform:translateX(4px);}
  }

  .submit-btn{
    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-size:.95rem;
    font-weight:600;
    font-family:var(--sans);
    cursor:pointer;
    transition:background .15s ease, opacity .15s ease;
    margin-top:6px;
  }
  .submit-btn:hover{background:#0077ed;}
  .submit-btn:disabled{opacity:.55;cursor:default;}

  .status{
    min-height:20px;
    font-size:.82rem;
    margin-top:14px;
    text-align:center;
    color:var(--ink-faint);
    transition:color .15s ease;
  }
  .status.error{color:var(--error);}
  .status.success{color:var(--accent);}

  footer{
    padding:24px 32px;
    text-align:center;
    font-size:.8rem;
    color:var(--ink-faint);
  }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="brand-dot"></span>DRE</div>
</header>

<div class="mesh"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>

<main>
  <div class="card">
    <div class="app-icon"><span></span></div>
    <h1>Sign in</h1>
    <p class="sub">Enter your access token to continue.</p>

    <form id="loginForm" onsubmit="return false;">
      <div class="field">
        <label for="token">Access token</label>
        <input type="password" id="token" placeholder="Enter your token" autocomplete="off" spellcheck="false">
      </div>
      <button class="submit-btn" id="submitBtn" type="submit">Continue</button>
      <div class="status" id="status"></div>
    </form>
  </div>
</main>

<footer style="position:relative;z-index:1;">© 2026 DRE. Built by the Andre Method.</footer>

<script>
  const input   = document.getElementById('token');
  const btn     = document.getElementById('submitBtn');
  const status  = document.getElementById('status');
  const REDIRECT = 'https://project-9dael.vercel.app/';
  let attempts = 0;

  function verify(){
    const val = input.value.trim();
    if(!val) return;

    if(val.toUpperCase() === 'DRE'){
      input.classList.remove('error');
      status.textContent = 'Access granted — redirecting…';
      status.className = 'status success';
      btn.disabled = true;
      input.disabled = true;
      setTimeout(() => { window.location.href = REDIRECT; }, 700);
      return;
    }

    attempts++;
    input.classList.add('error');
    setTimeout(() => input.classList.remove('error'), 300);
    status.textContent = attempts >= 3
      ? 'Too many attempts. Please try again shortly.'
      : 'That token isn\'t right. Please try again.';
    status.className = 'status error';
    input.value = '';
    input.focus();

    if(attempts >= 3){
      btn.disabled = true;
      input.disabled = true;
      setTimeout(() => {
        attempts = 0;
        btn.disabled = false;
        input.disabled = false;
        status.textContent = '';
        status.className = 'status';
      }, 4000);
    }
  }

  btn.addEventListener('click', verify);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') verify(); });
</script>

</body>
</html>
